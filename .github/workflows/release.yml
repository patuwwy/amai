name: Build and Release AMAI (.lha)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.2 - required)'
        required: true
        type: string
      upload_aminet:
        description: 'Upload package to Aminet FTP (/new/amai.lha, /new/amai.readme)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-amiga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Amiga Binaries and Create .lha Release
    runs-on: ubuntu-latest
    env:
      LHA_TAG: release-20211125

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies & lhasa
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool lhasa

      - name: Build and install LHa for UNIX
        run: |
          set -e
          git clone -q --depth 1 --branch "$LHA_TAG" \
            https://github.com/jca02266/lha.git /tmp/lha
          cd /tmp/lha
          autoreconf -is
          ./configure
          make -j"$(nproc)"
          sudo install -m 0755 src/lha /usr/local/bin/lha
          command -v lha
          lha | head -n 6

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::Release version was not specified in workflow dispatch!"
              exit 1
            fi
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release workflow triggered without a valid git tag or version input!"
            exit 1
          fi

      - name: Build Standalone Amiga Binaries and Package .lha
        run: |
          python tools/build_amiga.py \
            --version "${{ steps.get_version.outputs.VERSION }}" \
            --output-lha "amai-${{ steps.get_version.outputs.VERSION }}.lha"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amai-${{ steps.get_version.outputs.VERSION }}-release
          path: |
            amai-${{ steps.get_version.outputs.VERSION }}.lha
            dist_aminet/amai.lha
            dist_aminet/amai.readme
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: AMAI ${{ steps.get_version.outputs.VERSION }} - Amiga AI Assistant
          files: |
            amai-${{ steps.get_version.outputs.VERSION }}.lha
            dist_aminet/amai.lha
            dist_aminet/amai.readme
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### AMAI - Amiga AI Shell Release (${{ steps.get_version.outputs.VERSION }})

            Automated build for Commodore Amiga (AmigaOS 2.04+).
            Packaged as standard Amiga `.lha` archive containing standalone binaries powered by the [NodeAmiga](https://aminet.net/package/dev/lang/NodeAmiga) runtime.

            #### Included in `amai-${{ steps.get_version.outputs.VERSION }}.lha`:
            - `amai` - Standalone executable (Universal MC68000 / MC68010)
            - `amai_020` - Optimized for MC68020 / MC68030 (A1200 / A3000)
            - `amai_040` - Optimized for MC68040 (A4000)
            - `amai_060` - Optimized for MC68060 (Accelerator boards)
            - `amai.config.json` - Default configuration
            - `amai.readme` - Aminet-compliant readme
            - `README.md` - Documentation and setup instructions

      - name: Upload Package to Aminet FTP
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_aminet == 'true'
        env:
          AMINET_USER: ${{ secrets.AMINET_USER || 'anonymous' }}
          AMINET_PASSWORD: ${{ secrets.AMINET_EMAIL }}
        run: |
          python -c "
          import ftplib, os, sys
          user = os.environ.get('AMINET_USER', 'anonymous')
          passwd = os.environ.get('AMINET_PASSWORD')
          if not passwd:
              print('::error::AMINET_EMAIL secret is not set in repository settings!')
              sys.exit(1)

          print(f'Connecting to Aminet FTP server (main.aminet.net) as {user}...')
          try:
              with ftplib.FTP('main.aminet.net', timeout=60) as ftp:
                  ftp.login(user, passwd)
                  print('Logged in successfully. Changing directory to /new...')
                  ftp.cwd('new')
                  print('Uploading amai.lha (BINARY)...')
                  with open('dist_aminet/amai.lha', 'rb') as f:
                      ftp.storbinary('STOR amai.lha', f)
                  print('Uploading amai.readme (ASCII)...')
                  with open('dist_aminet/amai.readme', 'rb') as f:
                      ftp.storlines('STOR amai.readme', f)
                  print('🎉 Successfully uploaded amai.lha and amai.readme to Aminet /new!')
          except Exception as e:
              print(f'::error::Failed to upload to Aminet FTP: {e}')
              sys.exit(1)
          "

